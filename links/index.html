<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mengalihkan… — Andi Ulia Rahman</title>
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#ffffff" />
<link rel="canonical" href="https://andiulia.my.id/" />
<meta http-equiv="refresh" content="0; url=/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Cpath d='M12 46 L26 32 L38 38 L52 18' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='18' r='5' fill='%232997ff'/%3E%3C/svg%3E" />
<script>location.replace("/" + location.hash);</script>
<style>
  :root{
    --white:#ffffff; --mist:#f5f5f7; --ink:#1d1d1f; --steel:#6e6e73;
    --control:#e6e6e8; --blue:#0066cc;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:var(--white);color:var(--ink);text-align:center;
    font-family:'SF Pro Text','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:17px;line-height:1.47;letter-spacing:-.022em;
    -webkit-font-smoothing:antialiased;
  }
  .mark{
    width:64px;height:64px;border-radius:50%;margin:0 auto 24px;
    display:grid;place-items:center;
    background:var(--ink);color:#fff;
    font-family:'SF Pro Display','Inter',sans-serif;
    font-size:19px;font-weight:600;letter-spacing:-.01em;
  }
  p{margin:0;font-size:17px;color:var(--steel);}
  a{color:var(--blue);text-decoration:none;}
  a:hover{text-decoration:underline;}
  a:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px;}
  .bar{
    width:132px;height:2px;margin:26px auto 0;border-radius:9999px;
    background:var(--control);overflow:hidden;position:relative;
  }
  .bar::after{
    content:'';position:absolute;inset:0;width:40%;border-radius:9999px;
    background:var(--blue);animation:slide 1.1s var(--ease) infinite;
  }
  @keyframes slide{0%{transform:translateX(-100%);}100%{transform:translateX(250%);}}
  .sub{
    margin-top:18px;font-size:12px;color:var(--steel);letter-spacing:-.01em;
  }
  @media(prefers-reduced-motion:reduce){
    .bar::after{animation:none;width:100%;opacity:.35;}
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">AU</div>
    <p>Mengalihkan ke <a href="/">andiulia.my.id</a>…</p>
    <div class="bar" aria-hidden="true"></div>
    <div class="sub">Semua tautan &middot; Andi Ulia Rahman</div>
  </main>
</body>
</html>
