<style>
  :root{ --ink:#06070c; --txt:#eef1f7; --dim:#9aa6bd; --lime:#c9f73d; }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:var(--ink);color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

  .mark{
    width:64px;height:64px;border-radius:18px;margin:0 auto 22px;

    background:rgba(201,247,61,.10);border:1px solid rgba(201,247,61,.28);
    color:var(--lime);font-family:ui-monospace,monospace;font-weight:700;
    font-size:19px;letter-spacing:.06em;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  p{margin:0;font-size:14.5px;color:var(--dim);}
  a{color:var(--lime);text-decoration:none;border-bottom:1px solid rgba(201,247,61,.4);}
  a:hover{border-color:var(--lime);}
  .sub{margin-top:10px;font-size:12.5px;color:#5d6980;font-family:ui-monospace,monospace;letter-spacing:.08em;}
  @media(prefers-reduced-motion:reduce){ .mark{animation:none;} }
</style>
