<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · Halaman Tidak Ditemukan · Andi Ulia Rahman</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Cpath d='M12 46 L26 32 L38 38 L52 18' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='18' r='5' fill='%232997ff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --white:#ffffff; --mist:#f5f5f7; --ink:#1d1d1f; --slate:#707070; --steel:#6e6e73;
    --hair:#d6d6d6; --control:#e6e6e8;
    --blue:#0066cc; --blue-fill:#0071e3;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    display:grid;place-items:center;padding:32px 24px;
    background:var(--white);color:var(--ink);
    font-family:'SF Pro Text','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:17px;line-height:1.47;letter-spacing:-.022em;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:560px;text-align:center;}

  /* identity motif: short blue rule + small label, same as the portfolio eyebrows */
  .eyebrow{
    display:inline-flex;align-items:center;gap:9px;
    font-size:12px;font-weight:500;color:var(--steel);letter-spacing:-.01em;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--blue);}

  .code{
    margin-top:22px;
    font-family:'SF Pro Display','Inter',sans-serif;
    font-size:clamp(88px,17vw,140px);font-weight:600;line-height:.92;letter-spacing:-.045em;
    color:var(--ink);
  }
  h1{
    margin-top:18px;
    font-family:'SF Pro Display','Inter',sans-serif;
    font-size:clamp(24px,3.4vw,32px);font-weight:600;line-height:1.15;letter-spacing:-.021em;
  }
  p{margin-top:14px;color:var(--slate);font-size:17px;line-height:1.5;}

  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:13px 24px;border-radius:9999px;
    font-size:15px;font-weight:500;letter-spacing:-.01em;
    text-decoration:none;white-space:nowrap;
    transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease);
  }
  .btn-primary{background:var(--blue-fill);color:#fff;border:1px solid var(--blue-fill);}
  .btn-primary:hover{background:#0066cc;border-color:#0066cc;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--hair);}
  .btn-ghost:hover{background:var(--mist);border-color:var(--ink);}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px;}

  .domain{
    margin-top:44px;padding-top:22px;border-top:1px solid var(--control);
    font-size:12px;color:var(--steel);letter-spacing:-.01em;
  }

  /* MOTION 2: one quiet entrance, never a cascade */
  .rise{animation:rise .6s var(--ease) both;}
  .rise:nth-child(2){animation-delay:.05s;}
  .rise:nth-child(3){animation-delay:.1s;}
  .rise:nth-child(4){animation-delay:.15s;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){ .rise{animation:none;} }

  @media(max-width:420px){
    .btn{width:100%;justify-content:center;}
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow rise">Kesalahan 404</div>
  <div class="code rise">404</div>
  <h1 class="rise">Halaman ini tidak ditemukan</h1>
  <p class="rise">Mungkin tautannya sudah berubah, atau halaman tersebut memang belum ada. Kembali ke beranda untuk melihat semua tautan, atau langsung buka portofolio.</p>
  <div class="btns">
    <a class="btn btn-primary" href="/">Kembali ke Beranda</a>
    <a class="btn btn-ghost" href="/portofolio/">Lihat Portofolio</a>
  </div>
  <div class="domain">andiulia.my.id</div>
</main>
</body>
</html>
