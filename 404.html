<!DOCTYPE html>

<head>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#06070c;color:#eef1f7;position:relative;overflow:hidden;
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
  }
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .bg i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.32;}
  .bg i:nth-child(1){width:420px;height:420px;background:#1d3b8f;top:-140px;left:-120px;}
  .bg i:nth-child(2){width:380px;height:380px;background:#4d2a80;bottom:-140px;right:-110px;}
  .box{position:relative;z-index:2;text-align:center;max-width:520px;}
  .code{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:110px;line-height:1;
    letter-spacing:-.06em;
    background:linear-gradient(140deg,#c9f73d,#38e1ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;letter-spacing:-.03em;margin-top:14px;}
  p{color:#9aa6bd;font-size:14.5px;margin-top:11px;line-height:1.65;}
  .btns{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:28px;}
  a.btn{
    display:inline-block;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:550;
    text-decoration:none;transition:transform .25s cubic-bezier(.22,1,.36,1),background .25s,border-color .25s;
  }
  a.btn:hover{transform:translateY(-2px);}
  .p{background:#c9f73d;color:#06070c;}
  .g{border:1px solid rgba(255,255,255,.17);color:#eef1f7;background:rgba(255,255,255,.03);}
  .g:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07);}
  .mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:#626e87;margin-top:32px;letter-spacing:.08em;}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<div class="box">
  <div class="code">404</div>
  <h1>Halaman ini tidak ditemukan</h1>
  <p>Mungkin tautannya sudah berubah, atau halaman tersebut memang belum ada. Kembali ke beranda untuk melihat semua tautan, atau langsung buka portofolio.</p>
  <div class="btns">
    <a class="btn p" href="/">Kembali ke Beranda</a>
    <a class="btn g" href="/portofolio/">Lihat Portofolio</a>
  </div>
  <div class="mono">andiulia.my.id</div>
</div>
</body>
</html>
